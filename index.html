<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- =========================================================
    [EDIT 1/4] App name, description, and home screen icon
    Use a square image URL for the icon (512×512px recommended)
  ========================================================== -->
  <title>My Home App</title>
  <link id="favicon" rel="icon" href="./images/myapp-icon-512.png">
  
  <meta name="ojapp:title" content="My App">
  <meta name="ojapp:icon" content="./images/myapp-icon-512.png">
  <meta name="theme-color" content="#f4f1ff">

  <!-- OJapp Free: This one line turns the page into a home screen app -->
  <script src="https://ojapp.app/js/ojapp_1p1a.js"></script>

  <style>
    /* =========================================================
      [EDIT 2/4] Colors and appearance
      Change the color values below to customize the overall look
    ========================================================== */
    :root {
      --bg-top-end: #b1f0f8;
      --bg-after-scroll: #edf4ff;
      --text: #242333;
      --muted: #777489;
      --accent: #7658e8;
      --accent-soft: #ece7ff;
      --panel: rgba(255, 255, 255, 0.72);
      --line: rgba(71, 57, 116, 0.10);
      --shadow: 0 18px 45px rgba(69, 54, 120, 0.13);
      --radius: 30px;
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; background: var(--bg-top-end); }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
      background:
         radial-gradient( circle at 12% 25%, rgba(255, 255, 255, .18), transparent 27rem),
         radial-gradient( circle at 92% 92%, rgba(91, 176, 255, .18), transparent 25rem),
         linear-gradient( to bottom, var(--bg-top-end) 0, var(--bg-after-scroll) 160px, var(--bg-after-scroll) 38%, var(--bg-top-end) 100%);
      -webkit-font-smoothing: antialiased;
    }

    button, a { -webkit-tap-highlight-color: transparent; }

    .app-shell {
      width: min(100%, 520px);
      min-height: 100vh;
      min-height: 100svh;
      margin: 0 auto;
      padding: max(28px, env(safe-area-inset-top)) 18px max(28px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
    }

    .hero {
      padding: 18px 8px 22px;
      animation: rise .55s ease-out both;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 10px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 5px var(--accent-soft);
    }

    h1 {
      margin: 0;
      font-size: clamp(29px, 8vw, 42px);
      line-height: 1.18;
      letter-spacing: -.045em;
    }

    .lead {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
    }

    .panel {
      padding: 22px 14px 24px;
      border: 1px solid rgba(255,255,255,.75);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      animation: rise .65s .05s ease-out both;
    }

    .panel-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 0 8px 18px;
    }

    .panel-title { margin: 0; font-size: 15px; letter-spacing: .01em; }
    .app-count { color: var(--muted); font-size: 12px; }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 22px 8px;
    }

    .app-item {
      min-width: 0;
      color: inherit;
      text-align: center;
      text-decoration: none;
      border-radius: 18px;
      transition: transform .18s ease, opacity .18s ease;
    }

    .app-item:active { transform: scale(.92); opacity: .82; }
    .app-item:focus-visible { outline: 3px solid var(--accent); outline-offset: 5px; }

    .app-icon {
      position: relative;
      display: grid;
      place-items: center;
      width: clamp(55px, 15vw, 68px);
      aspect-ratio: 1;
      margin: 0 auto 8px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.72);
      border-radius: 22%;
      background: var(--icon-bg, #ffffff);
      box-shadow: 0 8px 18px rgba(50, 40, 88, .16), inset 0 1px rgba(255,255,255,.55);
      font-size: clamp(25px, 7vw, 32px);
    }

    .app-icon img { width: 100%; height: 100%; object-fit: cover; }

    .app-name {
      display: block;
      overflow: hidden;
      color: #3c394a;
      font-size: 11px;
      font-weight: 650;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .empty {
      display: none;
      padding: 34px 16px;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }

    .tip {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-top: 18px;
      padding: 15px 16px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(255,255,255,.46);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
      animation: rise .7s .1s ease-out both;
    }

    .tip-mark {
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 12px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 18px;
    }

    footer {
      margin-top: auto;
      padding: 28px 0 4px;
      color: var(--muted);
      text-align: center;
      font-size: 10px;
      letter-spacing: .04em;
    }

    footer a { color: inherit; text-underline-offset: 3px; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 350px) {
      .app-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }

    /* Hide the add-to-home-screen tip when launched as an app */
    @media (display-mode: standalone) {
      .tip { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
    
    @media (display-mode: standalone) {
      .remove-blur {
        position: fixed;
        inset: 0 0 auto;
        height: 11px;
        pointer-events: none;
        background-color: var(--bg-top-end);
        -webkit-background-clip: text;
        background-clip: text;
      }
    }
  </style>
</head>

<body>
  <div class="remove-blur" aria-hidden="true"></div>
  <main class="app-shell">
    <header class="hero">
      <!-- =====================================================
        [EDIT 3/4] Header text
      ====================================================== -->
      <span class="eyebrow">MY APP</span>
      <h1>Welcome back.</h1>
      <p class="lead">Everything you use, right here.</p>
    </header>

    <section class="panel" aria-labelledby="apps-title">
      <div class="panel-head">
        <h2 class="panel-title" id="apps-title">My Apps</h2>
        <span class="app-count" id="app-count"></span>
      </div>
      <div class="app-grid" id="app-grid"></div>
      <p class="empty" id="empty-message">Add your first app.</p>
    </section>

    <aside class="tip">
      <span class="tip-mark">＋</span>
      <span>Open your browser menu and choose “Add to Home Screen” to use this page like an app.</span>
    </aside>

    <footer>
      Powered by <a href="https://ojapp.app/one-page-one-app/en/" target="_blank" rel="noopener">OJapp Free</a>
    </footer>
  </main>

  <script>
    /* =========================================================
      [EDIT 4/4] Apps to display

      name  : Label shown below the icon
      url   : URL to open
      icon  : Emoji or image URL
      color : Icon background color

      Copy the { ... } block below to add as many apps as you like.
      Image URL example: icon: "https://example.com/icon.png"
    ========================================================== */
    const MY_APPS = [
      {
        name: "Website",
        url: "https://example.com/",
        icon: "🌐",
        color: "#e9f2ff"
      },
      {
        name: "Shop",
        url: "https://example.com/shop/",
        icon: "🛍️",
        color: "#fff0f4"
      },
      {
        name: "Blog",
        url: "https://example.com/blog/",
        icon: "✍️",
        color: "#fff5dc"
      },
      {
        name: "Profile",
        url: "https://example.com/profile/",
        icon: "👤",
        color: "#eeeaff"
      },
      {
        name: "Videos",
        url: "https://www.youtube.com/",
        icon: "",
        color: "#ffe8e8"
      },
      {
        name: "Photos",
        url: "https://www.instagram.com/",
        icon: "",
        color: "#f5e9ff"
      },
      {
        name: "Contact",
        url: "mailto:hello@example.com",
        icon: "✉️",
        color: "#e8f8f1"
      },
      {
        name: "Map",
        url: "https://maps.google.com/",
        icon: "📍",
        color: "#e9f8ed"
      }
    ];

    /* No changes are needed below this line */
    const grid = document.getElementById("app-grid");
    const count = document.getElementById("app-count");
    const empty = document.getElementById("empty-message");

    // Also hide the tip when launched from the iPhone home screen
    if (window.navigator.standalone === true) {
      document.querySelector(".tip")?.remove();
    }

    const isImage = (value) => /^(https?:\/\/|data:image\/|\/)/i.test(value);
    const getFavicon = (url) => {
      try {
       const parsedUrl = new URL(url);
        if (
          parsedUrl.protocol !== "http:" &&
          parsedUrl.protocol !== "https:"
        ) {
          return "";
        }
        return (
         "https://www.google.com/s2/favicons" +
         "?domain=" +
         encodeURIComponent(parsedUrl.hostname) +
         "&sz=128"
        );
      } catch {
        return "";
      }
    };

    MY_APPS.forEach((app) => {
      const link = document.createElement("a");
      link.className = "app-item";
      link.href = app.url;
      link.setAttribute("aria-label", app.name);
      const icon = document.createElement("span");
      icon.className = "app-icon";
      icon.style.setProperty( "--icon-bg", app.color || "#ffffff");
      const customIcon = app.icon || "";
      const autoIcon = getFavicon(app.url);
      if (isImage(customIcon) || (!customIcon && autoIcon)) {
        const image = document.createElement("img");
        image.src =
          isImage(customIcon)
            ? customIcon
            : autoIcon;
        image.alt = "";
        image.loading = "lazy";
        image.onerror = () => {
          image.remove();
          icon.textContent = "↗";
        };
        icon.appendChild(image);
      } else {
        icon.textContent = customIcon || "↗";
      }
      const name = document.createElement("span");
      name.className = "app-name";
      name.textContent = app.name;
      link.append(icon, name);
      grid.appendChild(link);
    });
    count.textContent = `${MY_APPS.length} APPS`;
    empty.style.display = MY_APPS.length ? "none" : "block";
    
    (() => {
      const standalone =
        matchMedia("(display-mode: standalone)").matches ||
        navigator.standalone === true;

      if (!standalone) return;

      const strip = document.querySelector(".remove-blur");
      if (!strip) return;

      const readColor = (name) => {
      const value = getComputedStyle(document.documentElement)
        .getPropertyValue(name).trim().replace("#", "");

      const hex = value.length === 3
        ? [...value].map((c) => c + c).join("")
        : value;

      return [
        parseInt(hex.slice(0, 2), 16),
        parseInt(hex.slice(2, 4), 16),
        parseInt(hex.slice(4, 6), 16)
      ];
    };

    const top = readColor("--bg-top-end");
    const after = readColor("--bg-after-scroll");
    const changeDistance = 160; // この距離で色Bになり、その後は固定

    function update() {
    const progress = Math.min((scrollY + 12) / changeDistance, 1);
      const rgb = top.map((value, i) =>
        Math.round(value + (after[i] - value) * progress)
      );

      strip.style.backgroundColor = `rgb(${rgb.join(",")})`;
    }

    update();
    addEventListener("scroll", update, { passive: true });
  })();    
  </script>
</body>
</html>
